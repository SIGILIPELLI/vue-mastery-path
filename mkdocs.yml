      - "02 · create-vue, Vite & Project Structure": level-1/02-tooling-project-structure.md
      - "03 · Template Syntax & Directives": level-1/03-template-syntax.md
      - "04 · Reactivity: ref, reactive, computed": level-1/04-reactivity-ref-reactive-computed.md
      - "05 · Watchers & Lifecycle Hooks": level-1/05-watchers-lifecycle.md
      - "06 · Components: Props & Emits": level-1/06-props-emits.md
      - "07 · Forms & v-model": level-1/07-forms-v-model.md
      - "08 · Slots": level-1/08-slots.md
      - "09 · Styling & Transitions": level-1/09-styling-transitions.md
      - "10 · Project — A Habit Tracker": level-1/10-project-habit-tracker.md
